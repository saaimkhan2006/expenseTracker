services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
  api:
    build: ./backend
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/smart-budget}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports: ["4000:4000"]
    depends_on: [mongo]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongo-data:
