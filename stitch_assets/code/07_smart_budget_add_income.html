<script>
  (function initAddIncomeFlow() {
    let rawAmount = 8000;
    let isTdsChecked = false;
    let isRecurring = false;

    const amountInput = document.getElementById('amount-input');
    const ctaAmount = document.getElementById('cta-amount-display');
    const tdsNetVal = document.getElementById('tds-net-val');
    const tdsCheckbox = document.getElementById('tds-checkbox');
    const tdsCheckIcon = document.getElementById('tds-check-icon');
    const recurringToggle = document.getElementById('recurring-toggle');
    const recurringTrack = document.getElementById('recurring-track');
    const recurringThumb = document.getElementById('recurring-thumb');
    const activeSourceIndicator = document.getElementById('active-source-indicator');

    function renderAmounts() {
      const formatted = rawAmount.toLocaleString('en-IN');
      amountInput.value = formatted;
      ctaAmount.textContent = '₹' + formatted;

      if (isTdsChecked) {
        const net = Math.round(rawAmount * 0.9);
        tdsNetVal.textContent = 'Net: ₹' + net.toLocaleString('en-IN');
      } else {
        tdsNetVal.textContent = 'Net: ₹' + formatted;
      }
    }

    // Quick multiplier increments
    document.querySelectorAll('.multiplier-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const delta = parseInt(btn.getAttribute('data-delta'), 10) || 0;
        rawAmount += delta;
        renderAmounts();
      });
    });

    // Income Source Selector
    document.querySelectorAll('.source-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.source-tile').forEach(t => {
          t.setAttribute('aria-checked', 'false');
          t.className = 'source-tile group relative flex flex-col items-start p-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-left transition-all active:scale-[0.98]';
          const iconBox = t.querySelector('div:first-child');
          if (iconBox) {
            iconBox.className = 'w-7 h-7 rounded-md bg-surface-container-high flex items-center justify-center text-on-surface mb-2';
          }
          const checkIcon = t.querySelector('.material-symbols-outlined.font-bold');
          if (checkIcon) checkIcon.remove();
          const categoryText = t.querySelector('span:nth-of-type(1)');
          if (categoryText) categoryText.className = 'font-body-sm text-body-sm font-medium text-on-surface leading-tight';
          const subText = t.querySelector('span:nth-of-type(2)');
          if (subText) subText.className = 'font-label-xs text-[10px] text-on-surface-variant font-mono mt-0.5';
        });

        // Activate clicked tile
        tile.setAttribute('aria-checked', 'true');
        tile.className = 'source-tile group relative flex flex-col items-start p-3 rounded-lg bg-primary-fixed text-on-primary-fixed transition-all active:scale-[0.98] shadow-md shadow-primary-fixed/10';
        
        const firstRow = tile.querySelector('div');
        if (firstRow) {
          firstRow.className = 'w-full flex items-center justify-between mb-2';
          firstRow.innerHTML = `
            <div class="w-7 h-7 rounded-md bg-on-primary-fixed flex items-center justify-center text-primary-fixed">
              <span class="material-symbols-outlined text-[17px]">terminal</span>
            </div>
            <span class="material-symbols-outlined text-[18px] text-on-primary-fixed font-bold leading-none">check_circle</span>
          `;
        }
        
        const cat = tile.getAttribute('data-category');
        if (activeSourceIndicator && cat) {
          activeSourceIndicator.textContent = cat.toUpperCase();
        }
      });
    });

    // Destination Account Selector
    document.querySelectorAll('.account-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.account-pill').forEach(p => {
          p.setAttribute('aria-checked', 'false');
          p.className = 'account-pill flex items-center justify-between p-2.5 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface-variant transition-all active:scale-[0.98]';
          const dot = p.querySelector('.rounded-full');
          if (dot) dot.className = 'w-2 h-2 rounded-full bg-surface-variant shrink-0';
          const name = p.querySelector('.text-on-surface');
          if (name) name.className = 'font-body-sm text-body-sm font-medium text-on-surface truncate';
        });

        pill.setAttribute('aria-checked', 'true');
        pill.className = 'account-pill flex items-center justify-between p-2.5 rounded-lg bg-surface-container-highest text-on-surface transition-all active:scale-[0.98]';
        const activeDot = pill.querySelector('.rounded-full');
        if (activeDot) activeDot.className = 'w-2 h-2 rounded-full bg-primary-fixed shrink-0';
      });
    });

    // TDS Withholding Toggle
    tdsCheckbox.addEventListener('click', () => {
      isTdsChecked = !isTdsChecked;
      tdsCheckbox.setAttribute('aria-checked', isTdsChecked ? 'true' : 'false');
      if (isTdsChecked) {
        tdsCheckbox.classList.remove('bg-surface-container-high');
        tdsCheckbox.classList.add('bg-primary-fixed');
        tdsCheckIcon.classList.remove('hidden');
      } else {
        tdsCheckbox.classList.remove('bg-primary-fixed');
        tdsCheckbox.classList.add('bg-surface-container-high');
        tdsCheckIcon.classList.add('hidden');
      }
      renderAmounts();
    });

    // Recurring Inflow Switcher
    recurringToggle.addEventListener('click', () => {
      isRecurring = !isRecurring;
      recurringToggle.setAttribute('aria-checked', isRecurring ? 'true' : 'false');
      if (isRecurring) {
        recurringTrack.classList.remove('bg-surface-variant');
        recurringTrack.classList.add('bg-primary-fixed');
        recurringThumb.classList.remove('bg-on-surface-variant', 'left-0.5');
        recurringThumb.classList.add('bg-on-primary-fixed', 'left-3.5');
      } else {
        recurringTrack.classList.remove('bg-primary-fixed');
        recurringTrack.classList.add('bg-surface-variant');
        recurringThumb.classList.remove('bg-on-primary-fixed', 'left-3.5');
        recurringThumb.classList.add('bg-on-surface-variant', 'left-0.5');
      }
    });

    // Submit Action Micro-Delight
    document.getElementById('submit-btn').addEventListener('click', function() {
      this.classList.add('scale-95');
      setTimeout(() => {
        this.classList.remove('scale-95');
      }, 150);
    });

    renderAmounts();
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-low/95 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.25)]" data-active-classes="text-primary-fixed"><div class="h-[72px] px-space-sm flex items-center justify-around"><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-on-surface" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-xs text-label-xs tracking-wider uppercase mt-1">Home</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-primary-fixed transition-colors hover:text-primary-fixed" data-path="activity" href="#"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="font-label-xs text-label-xs tracking-wider uppercase mt-1 font-semibold">Activity</span></a><div class="flex items-center justify-center"><a aria-current="page" aria-label="Add Transaction" class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center shadow-[0_2px_10px_rgba(195,244,0,0.25)] active:scale-95 transition-transform text-primary-fixed" data-path="add-transaction" href="#"><span class="material-symbols-outlined text-[26px] font-bold">add</span></a></div><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-on-surface" data-path="plan" href="#"><span class="material-symbols-outlined text-[24px]">pie_chart</span><span class="font-label-xs text-label-xs tracking-wider uppercase mt-1">Plan</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-on-surface" data-path="profile" href="#"><span class="material-symbols-outlined text-[24px]">account_balance_wallet</span><span class="font-label-xs text-label-xs tracking-wider uppercase mt-1">Profile</span></a></div></nav>
